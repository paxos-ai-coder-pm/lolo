<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Experiment dashboard</title>
<style>
  :root {
    --bg: #f7f7f8; --card: #fff; --text: #1f2328; --muted: #6b7280; --grid: #e5e7eb;
    --accent: #2563eb; --good: #16a34a; --bad: #dc2626; --best: #f59e0b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111318; --card: #1b1e25; --text: #e6e8eb; --muted: #9aa1ab; --grid: #2c313a;
            --accent: #60a5fa; --good: #4ade80; --bad: #f87171; --best: #fbbf24; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 20px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card, .panel { background: var(--card); border: 1px solid var(--grid); border-radius: 8px; padding: 14px; }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .card .value { font-size: 22px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .card .extra { color: var(--muted); font-size: 12px; }
  .charts { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-bottom: 20px; }
  @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
  .panel h2 { font-size: 14px; margin: 0 0 8px; }
  svg { width: 100%; height: 260px; display: block; }
  svg text { fill: var(--muted); font-size: 11px; }
  .legend { color: var(--muted); font-size: 12px; display: flex; gap: 14px; margin-top: 6px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .controls { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  input, select { background: var(--card); color: var(--text); border: 1px solid var(--grid); border-radius: 6px; padding: 6px 8px; font: inherit; }
  input { flex: 1; min-width: 200px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { cursor: pointer; user-select: none; color: var(--muted); font-weight: 600; white-space: nowrap; }
  th.sorted::after { content: attr(data-dir); }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kept { color: var(--good); font-weight: 600; }
  .discarded { color: var(--bad); }
  .notes { color: var(--muted); max-width: 420px; }
  #status { color: var(--muted); font-size: 12px; }
  #tip { position: fixed; pointer-events: none; background: var(--card); border: 1px solid var(--grid); border-radius: 6px;
         padding: 6px 8px; font-size: 12px; display: none; max-width: 320px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
</style>
</head>
<body>
<h1>Compression experiments</h1>
<div class="sub">Metric: compressed bytes / original bytes (lower is better) &middot; <span id="status">loading…</span></div>

<div class="cards" id="cards"></div>

<div class="charts">
  <div class="panel">
    <h2>Metric per experiment</h2>
    <svg id="metricChart"></svg>
    <div class="legend">
      <span><span class="dot" style="background:var(--good)"></span>kept</span>
      <span><span class="dot" style="background:var(--bad)"></span>discarded</span>
      <span><span class="dot" style="background:var(--best)"></span>best so far</span>
    </div>
  </div>
  <div class="panel">
    <h2>Test pass rate</h2>
    <svg id="passChart"></svg>
  </div>
</div>

<div class="panel">
  <div class="controls">
    <input id="filter" placeholder="Filter by hypothesis or notes…">
    <select id="decisionFilter">
      <option value="">All decisions</option>
      <option value="kept">Kept</option>
      <option value="discarded">Discarded</option>
    </select>
  </div>
  <table>
    <thead><tr>
      <th data-key="id">id</th>
      <th data-key="hypothesis">hypothesis</th>
      <th data-key="metric">metric</th>
      <th data-key="decision">decision</th>
      <th data-key="duration_seconds">duration (s)</th>
      <th data-key="notes">notes</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<div id="tip"></div>

<script>
const REFRESH_MS = 5000;
let entries = [];
let sortKey = "id", sortDir = 1;

const fmt = (v, d = 4) => v == null || isNaN(v) ? "—" : Number(v).toFixed(d);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function load() {
  try {
    const res = await fetch("experiments.jsonl?t=" + Date.now(), {cache: "no-store"});
    if (!res.ok) throw new Error(res.status + " " + res.statusText);
    const text = await res.text();
    entries = text.split("\n").filter(l => l.trim()).map(l => { try { return JSON.parse(l); } catch { return null; } })
                  .filter(Boolean);
    document.getElementById("status").textContent = `updated ${new Date().toLocaleTimeString()} · refreshes every ${REFRESH_MS / 1000}s`;
  } catch (e) {
    document.getElementById("status").textContent = `could not load experiments.jsonl (${e.message})`;
  }
  render();
}

function render() { renderCards(); renderMetricChart(); renderPassChart(); renderTable(); }

function renderCards() {
  const valid = entries.filter(e => e.metric != null);
  const baseline = valid.length ? valid[0].metric : null;
  const best = valid.length ? Math.min(...valid.map(e => e.metric)) : null;
  const kept = entries.filter(e => e.decision === "kept").length;
  const discarded = entries.filter(e => e.decision === "discarded").length;
  const absImp = baseline != null && best != null ? baseline - best : null;
  const pctImp = absImp != null && baseline ? absImp / baseline * 100 : null;
  const cards = [
    ["Current best", fmt(best), ""],
    ["Baseline", fmt(baseline), ""],
    ["Total improvement", fmt(absImp), pctImp == null ? "" : pctImp.toFixed(2) + "% lower"],
    ["Experiments", entries.length, ""],
    ["Kept / discarded", `${kept} / ${discarded}`, ""],
    ["Keep rate", entries.length ? (kept / entries.length * 100).toFixed(0) + "%" : "—", ""],
  ];
  document.getElementById("cards").innerHTML = cards.map(([l, v, x]) =>
    `<div class="card"><div class="label">${l}</div><div class="value">${v}</div><div class="extra">${x}</div></div>`).join("");
}

function svgFrame(svg) {
  const w = svg.clientWidth || 600, h = svg.clientHeight || 260;
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  return {w, h, m: {l: 52, r: 12, t: 10, b: 28}};
}

function axes(f, xs, yMin, yMax, yFmt) {
  const {w, h, m} = f;
  const pw = w - m.l - m.r, ph = h - m.t - m.b;
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const X = x => m.l + (xMax === xMin ? pw / 2 : (x - xMin) / (xMax - xMin) * pw);
  const Y = y => m.t + (yMax === yMin ? ph / 2 : (1 - (y - yMin) / (yMax - yMin)) * ph);
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const v = yMin + (yMax - yMin) * i / 4, y = Y(v);
    g += `<line x1="${m.l}" x2="${w - m.r}" y1="${y}" y2="${y}" stroke="var(--grid)"/>`;
    g += `<text x="${m.l - 6}" y="${y + 4}" text-anchor="end">${yFmt(v)}</text>`;
  }
  const step = Math.max(1, Math.ceil((xMax - xMin + 1) / 10));
  for (let x = xMin; x <= xMax; x += step)
    g += `<text x="${X(x)}" y="${h - 8}" text-anchor="middle">${x}</text>`;
  return {X, Y, g};
}

function emptyChart(svg, msg) {
  const f = svgFrame(svg);
  svg.innerHTML = `<text x="${f.w / 2}" y="${f.h / 2}" text-anchor="middle">${msg}</text>`;
}

function renderMetricChart() {
  const svg = document.getElementById("metricChart");
  const pts = entries.filter(e => e.metric != null);
  if (!pts.length) return emptyChart(svg, "no valid runs yet");
  const f = svgFrame(svg);
  const vals = pts.map(e => e.metric).concat(entries.map(e => e.best_so_far).filter(v => v != null));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.1 || Math.abs(hi) * 0.05 || 0.01;
  lo -= pad; hi += pad;
  const {X, Y, g} = axes(f, entries.map(e => e.id), lo, hi, v => v.toFixed(3));
  // best-so-far step line (computed from data, falling back to logged value)
  let best = null, path = "";
  entries.forEach((e, i) => {
    if (e.metric != null && e.decision === "kept") best = best == null ? e.metric : Math.min(best, e.metric);
    const b = best ?? e.best_so_far;
    if (b == null) return;
    path += path ? ` H${X(e.id)} V${Y(b)}` : `M${X(e.id)} ${Y(b)}`;
  });
  let dots = "";
  for (const e of pts) {
    const color = e.decision === "kept" ? "var(--good)" : "var(--bad)";
    dots += `<circle cx="${X(e.id)}" cy="${Y(e.metric)}" r="5" fill="${color}" data-id="${e.id}"/>`;
  }
  svg.innerHTML = g + `<path d="${path}" fill="none" stroke="var(--best)" stroke-width="2"/>` + dots;
  attachTips(svg);
}

function renderPassChart() {
  const svg = document.getElementById("passChart");
  const pts = entries.filter(e => e.tests_total);
  if (!pts.length) return emptyChart(svg, "no test data yet");
  const f = svgFrame(svg);
  const {X, Y, g} = axes(f, entries.map(e => e.id), 0, 100, v => v.toFixed(0) + "%");
  const rate = e => e.tests_passed / e.tests_total * 100;
  const line = pts.map((e, i) => `${i ? "L" : "M"}${X(e.id)} ${Y(rate(e))}`).join(" ");
  const dots = pts.map(e => `<circle cx="${X(e.id)}" cy="${Y(rate(e))}" r="4" fill="${rate(e) === 100 ? "var(--accent)" : "var(--bad)"}" data-id="${e.id}"/>`).join("");
  svg.innerHTML = g + `<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>` + dots;
  attachTips(svg);
}

function attachTips(svg) {
  const tip = document.getElementById("tip");
  svg.querySelectorAll("circle").forEach(c => {
    c.addEventListener("mousemove", ev => {
      const e = entries.find(x => String(x.id) === c.dataset.id);
      if (!e) return;
      tip.innerHTML = `<b>#${e.id}</b> ${esc(e.decision)} · metric ${fmt(e.metric)} · tests ${e.tests_passed}/${e.tests_total}<br>${esc(e.hypothesis)}`;
      tip.style.display = "block";
      tip.style.left = Math.min(ev.clientX + 12, innerWidth - 340) + "px";
      tip.style.top = ev.clientY + 12 + "px";
    });
    c.addEventListener("mouseleave", () => tip.style.display = "none");
  });
}

function renderTable() {
  const q = document.getElementById("filter").value.toLowerCase();
  const d = document.getElementById("decisionFilter").value;
  const rows = entries
    .filter(e => !d || e.decision === d)
    .filter(e => !q || `${e.hypothesis} ${e.notes}`.toLowerCase().includes(q))
    .sort((a, b) => {
      const x = a[sortKey], y = b[sortKey];
      if (x == null) return 1;
      if (y == null) return -1;
      return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * sortDir;
    });
  document.getElementById("rows").innerHTML = rows.map(e => `<tr>
    <td class="num">${esc(e.id)}</td>
    <td>${esc(e.hypothesis)}</td>
    <td class="num">${fmt(e.metric, 6)}</td>
    <td class="${esc(e.decision)}">${esc(e.decision)}</td>
    <td class="num">${fmt(e.duration_seconds, 2)}</td>
    <td class="notes">${esc(e.notes)}</td></tr>`).join("");
  document.querySelectorAll("th").forEach(th => {
    th.classList.toggle("sorted", th.dataset.key === sortKey);
    th.dataset.dir = sortDir === 1 ? " ▲" : " ▼";
  });
}

document.querySelectorAll("th").forEach(th => th.addEventListener("click", () => {
  if (sortKey === th.dataset.key) sortDir = -sortDir; else { sortKey = th.dataset.key; sortDir = 1; }
  renderTable();
}));
document.getElementById("filter").addEventListener("input", renderTable);
document.getElementById("decisionFilter").addEventListener("change", renderTable);
window.addEventListener("resize", () => { renderMetricChart(); renderPassChart(); });

load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
